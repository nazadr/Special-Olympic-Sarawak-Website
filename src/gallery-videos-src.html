<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Video Title | Special Olympics Sarawak</title>

    <style>
        .body {
            background-color: white;
            overflow-y: auto;
            min-height: 100vh;
        }
        .gallery-vid-play {
            width: 100%;
            background: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .galler-vid-video {
            width: 100%;
            max-width: 1065px;
            margin: 0 auto;
            aspect-ratio: 16 / 9;
            display: flex;
            align-items: center;
            justify-content: center;
            background: black;
        }
        .gallery-vid-video video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .gallery-vid-videsc {
            width: 1200px;
            margin: 40px auto 80px auto;
        }
        .gallery-vid-videsc h1 {
            color: #c4161c;
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 0;
            padding: 0 12px;
        }
        .gallery-vid-videsc h2 {
            color: #333;
            font-size: 2.5rem;
            font-weight: 600;
            margin-top: 16px;
            padding: 0 12px;
        }
        .gallery-vid-videsc p {
            color: #333;
            font-size: 1.1rem;
            padding: 0 12px;
        }
        @media (max-width: 768px) {
            .gallery-vid-play {
                max-width: 100vw;
                padding: 0;
            }
            .gallery-vid-video {
                aspect-ratio: 16 / 9;
                width: 100vw;
                min-width: 0;
            }
            .gallery-vid-videsc {
                width: 100%;
                margin: 24px auto 40px auto;
            }
            .gallery-vid-videsc h1 {
                font-size: 0.9rem;
            }
            .gallery-vid-videsc h2 {
                font-size: 1.8rem;
            }
            .gallery-vid-videsc p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <script src="../scripts/components/header.js"></script>
