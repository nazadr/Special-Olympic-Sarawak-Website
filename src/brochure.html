<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brochure | Special Olympics Sarawak</title>
    <link rel="shortcut icon" href="../assets/images/master_logo_front.png">
    <link rel="stylesheet" href="../css/global-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        .brochure-hero {
            background: linear-gradient(135deg, #ca3441 0%, #db2727 100%);
            height: 40vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            position: relative;
        }

        .brochure-hero h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        .brochure-hero p {
            font-size: 1.2rem;
            max-width: 800px;
            margin: 0 auto 30px;
        }

        /* Image card */
        .brochure-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            margin: 40px auto 0 auto;
            max-width: 1200px;
            padding: 0 12px;
        }

        .brochure-card {
            width: 100%;
            max-width: 1200px;
            aspect-ratio: 1200 / 832;
            background: #fff;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brochure-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Download button */
        .brochure-button {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 300px; /* Previously: 200px */
            height: 60px;
            background-color: #c41926;
            border: none;
            margin: 40px auto 80px auto;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .brochure-button a {
            text-decoration: none;
            color: white;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .brochure-button:hover {
            background-color: #e94e1b;
        }

        @media (max-width: 768px) {
            .brochure-hero {
                height: 20vh;
            }
            .brochure-hero h1 {
                font-size: 2.2rem;
            }
            .brochure-container {
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation Bar (Loaded via JS) -->
    <script src="../scripts/components/header.js"></script>

    <!-- Social Media Bar (Loaded via JS) -->
    <script src="../scripts/components/socmed-bar.js"></script>

    <!-- Space for existing header -->
    <div class="header-space"></div>

    <section class="brochure-hero">
        <h1>Brochure</h1>
    </section>

    <section class="brochure-preview">
        <div class="brochure-container">
            <div class="brochure-card">
                <img src="../assets/images/brochure-preview-1.png" alt="Page 1">
            </div>
            <div class="brochure-card">
                <img src="../assets/images/brochure-preview-2.png" alt="Page 2">
            </div>
            <div class="brochure-button">
                <a href="../assets/pdf/Special Olympics - BROCHURE SOBC 2025.pdf">Download PDF</a>
            </div>
        </div>
    </section>

    <!-- Bottom Navigation -->
    <script src="../scripts/components/bottom-nav.js"></script>

    <!-- Site footer -->
    <script src="../scripts/components/site-footer.js"></script>

    <script src="../scripts/script.js"></script>
</body>
</html>
