<!-- Use this if some pages are not existed yet or currently in development -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Error | Special Olympics Sarawak</title>
    <link rel="shortcut icon" href="../assets/images/master_logo_front.png">
    <link rel="stylesheet" href="../css/global-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        /* Make the error image fill the entire viewport */
        .error-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            z-index: 10;
            background: black;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .error-container img {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: -1;
            margin: 0;
            padding: 0;
            pointer-events: none;
            opacity: 50%;
        }

        /* Optional: Overlay text and button above the image */
        .error-container h1,
        .error-container p,
        .error-container button {
            position: relative;
            z-index: 1;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
            text-align: center;
        }
        .error-container p {
            font-size: 1.1rem;
            line-height: 1.6;
            padding: 0 20px;
        }
        .error-container button {
            background: #c41926;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 12px 32px;
            font-size: 1.1rem;
            margin-top: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .error-container button:hover {
            background-color: #e94e1b;
        }
        .error-container button a {
            color: #fff;
            text-decoration: none;
            text-shadow: none;
        }

        .bottom-nav-legacy {
            z-index: 20;
            position: fixed;
            left: 50%;
            bottom: 60px;
            transform: translateX(-50%);
            width: auto; /* or set a fixed width if needed */
        }
    </style>
</head>
<body>
    <script src="../scripts/components/header.js"></script>
    <script src="../scripts/components/socmed-bar.js"></script>

    <div class="error-container">
        <img src="../assets/images/404-dev.jpg">
        <h1>404 Error</h1>
        <p>Meow~ The page that you're looking for is not here.<br>It could be that the page is not available or currently in development.</p>
        <button id="returnBtn"><a href="javascript:void(0)">Return to page</a></button>
    </div>

    <script src="../scripts/components/bottom-nav.js"></script>
    <script src="../scripts/script.js"></script>

    <script>
        document.getElementById('returnBtn').addEventListener('click', function() {
            window.history.back();
        });
    </script>
</body>
</html>
