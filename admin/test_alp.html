<!DOCTYPE html>
<html>
<head>
    <title>ALP System Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .success { color: green; }
        .error { color: red; }
        button { padding: 10px 20px; margin: 5px; }
    </style>
</head>
<body>
    <h1>ALP System Test</h1>
    
    <div class="test-section">
        <h3>Test 1: Backend Connection</h3>
        <button onclick="testBackend()">Test Backend</button>
        <div id="backend-result"></div>
    </div>
    
    <div class="test-section">
        <h3>Test 2: Fetch Articles</h3>
        <button onclick="testFetch()">Fetch Articles</button>
        <div id="fetch-result"></div>
    </div>
    
    <div class="test-section">
        <h3>Test 3: Image Upload</h3>
        <form id="uploadForm" enctype="multipart/form-data">
            <input type="file" id="testImage" name="alpImage" accept="image/*">
            <input type="text" id="testTitle" name="title" placeholder="Test Title" value="Test Article">
            <select id="testCategory" name="category">
                <option value="LEADERSHIP DEVELOPMENT">Leadership Development</option>
            </select>
            <textarea id="testDescription" name="description" placeholder="Test Description">This is a test article.</textarea>
            <input type="hidden" name="action" value="add">
            <button type="button" onclick="testUpload()">Test Upload</button>
        </form>
        <div id="upload-result"></div>
    </div>

    <script>
        function testBackend() {
            fetch('handler/admin_alp_handler.php?test=1')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('backend-result').innerHTML = 
                        '<div class="success">Backend accessible. Response: ' + data + '</div>';
                })
                .catch(error => {
                    document.getElementById('backend-result').innerHTML = 
                        '<div class="error">Backend error: ' + error.message + '</div>';
                });
        }

        function testFetch() {
            fetch('handler/admin_alp_handler.php?action=fetch')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('fetch-result').innerHTML = 
                        '<div class="success">Fetch successful: ' + JSON.stringify(data, null, 2) + '</div>';
                })
                .catch(error => {
                    document.getElementById('fetch-result').innerHTML = 
                        '<div class="error">Fetch error: ' + error.message + '</div>';
                });
        }

        function testUpload() {
            const form = document.getElementById('uploadForm');
            const formData = new FormData(form);
            
            fetch('handler/admin_alp_handler.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('upload-result').innerHTML = 
                    '<div class="' + (data.success ? 'success' : 'error') + '">Upload result: ' + JSON.stringify(data, null, 2) + '</div>';
            })
            .catch(error => {
                document.getElementById('upload-result').innerHTML = 
                    '<div class="error">Upload error: ' + error.message + '</div>';
            });
        }
    </script>
</body>
</html>
